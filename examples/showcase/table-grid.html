<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Table grid</title>
</head>
<body>
  <table>
    <caption>Build matrix</caption>
    <tr><th scope="rows">Target</th><th>Status</th></tr>

    <tr><td colspan="2">macos</td></tr>
  </table>
</body>
</html>
